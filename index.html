<style>
  :root {
    --bg: #ffffff;
    --bg2: #f2f2f7;
    --text: #1c1c1e;
    --sub: #8a8a8e;
    --line: rgba(60,60,67,.16);
    --accent: #fa243c;
    --grad: linear-gradient(135deg, #ff6a88, #fa243c 55%, #ff5a36);
    --glass: rgba(250,250,252,.8);
    --seg-active: #ffffff;
    --tint-amt: 22%;
    --nav-h: 54px;
    --mini-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --spring: cubic-bezier(.34, 1.45, .52, 1);
    --smooth: cubic-bezier(.22, .9, .28, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --bg2: #1c1c1e;
      --text: #ffffff;
      --sub: #98989f;
      --line: rgba(84,84,88,.5);
      --glass: rgba(28,28,30,.8);
      --seg-active: #636366;
      --tint-amt: 36%;
    }
  }
  :root[data-theme="dark"] {
      --bg: #000000;
      --bg2: #1c1c1e;
      --text: #ffffff;
      --sub: #98989f;
      --line: rgba(84,84,88,.5);
      --glass: rgba(28,28,30,.8);
      --seg-active: #636366;
      --tint-amt: 36%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; overscroll-behavior-y: none;
    color: var(--text); min-height: 100vh; overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  input { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
  button:focus-visible, input:focus-visible, .row:focus-visible, .card:focus-visible, .hero:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .hidden { display: none !important; }
  .ic { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }

  /* ---------- Animations communes ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes push { from { opacity: 0; transform: translateX(36px); } }
  @keyframes pop-back { from { opacity: 0; transform: translateX(-36px); } }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }
  @keyframes pop { from { transform: scale(.78); opacity: 0; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  @keyframes drift {
    from { transform: translate(-5%, -4%) scale(1.15) rotate(0deg); }
    to   { transform: translate(5%, 4%) scale(1.4) rotate(16deg); }
  }
  @keyframes breathe {
    0%, 100% { opacity: .3; transform: scale(1.06); }
    50% { opacity: .62; transform: scale(1.2); }
  }
  .rise { animation: rise .62s var(--smooth) var(--d, 0ms) backwards; }
  .v-push { animation: push .5s var(--smooth) backwards; }
  .v-pop { animation: pop-back .5s var(--smooth) backwards; }
  .v-push .detail-head .art { animation: pop .65s var(--spring) .08s backwards; }
  .swap { animation: swap .42s var(--smooth); }

  /* Retour tactile sur tout ce qui se touche */
  .row, .card, .pill, .round-btn, .primary, .ctl, .s-controls button, .s-foot button, .nav button, .hero, .h-play, .back {
    transition: transform .3s var(--spring), background-color .25s, opacity .25s, color .25s;
  }
  .pill:active, .round-btn:active, .primary:active, .ctl:active, .s-controls button:active, .s-foot button:active, .h-play:active { transform: scale(.92); }
  .row:active { transform: scale(.985); }
  .card:active, .hero:active { transform: scale(.97); }
  .back:active { transform: translateX(-3px); opacity: .6; }

  /* ---------- Structure ---------- */
  #main { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 28px); position: relative; transform-origin: 50% 0; transition: transform .55s var(--smooth), filter .55s, border-radius .55s; }
  body.has-mini #main { padding-bottom: calc(var(--nav-h) + var(--safe-b) + var(--mini-h) + 40px); }
  body.sheet-open #main { transform: scale(.93) translateY(10px); filter: brightness(.55); border-radius: 20px; }
  #main::before {
    content: ""; position: fixed; z-index: -1; left: 0; right: 0; top: 0; height: 380px; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tint, transparent) var(--tint-amt), transparent), transparent);
    opacity: 0; transition: opacity 1s;
  }
  body.has-mini #main::before { opacity: 1; }
  .view { max-width: 920px; margin: 0 auto; padding: 0 20px; }

  .topbar {
    position: fixed; z-index: 15; top: 0; left: 0; right: 0; height: calc(var(--safe-t) + 46px); padding-top: var(--safe-t);
    display: grid; place-items: center; background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .topbar.on { opacity: 1; }
  .topbar span { font-size: 17px; font-weight: 650; max-width: 62%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
    display: flex; background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border-top: 1px solid var(--line);
  }
  .nav .brand { display: none; }
  .nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 10.5px; font-weight: 500; color: var(--sub);
  }
  .nav button.active { color: var(--accent); }
  .nav button.pop svg { animation: bump .55s var(--spring); }

  @media (min-width: 900px) {
    .nav {
      top: 0; right: auto; width: 232px; height: 100%; padding: 26px 12px; flex-direction: column; justify-content: flex-start; gap: 2px;
      border-top: 0; border-right: 1px solid var(--line);
    }
    .nav .brand { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; padding: 0 12px 18px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav button { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 15px; padding: 9px 12px; border-radius: 8px; color: var(--text); }
    .nav button:hover { background: var(--bg2); }
    .nav button.active { background: var(--bg2); color: var(--accent); }
    #main { padding-left: 232px; }
    body.has-mini #main { padding-bottom: calc(var(--mini-h) + 48px); }
    .topbar { left: 232px; }
  }

  /* ---------- Titres et boutons ---------- */
  .large-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(var(--safe-t) + 26px) 0 14px; }
  .large-title h1 { font-size: 34px; font-weight: 800; letter-spacing: -.025em; }
  .round-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg2); color: var(--accent); display: grid; place-items: center; }
  .round-btn:hover { transform: rotate(90deg); }
  .round-btn .ic { width: 20px; height: 20px; }
  h2.section { font-size: 22px; font-weight: 700; letter-spacing: -.015em; margin: 28px 0 12px; }

  .actions { display: flex; gap: 12px; margin: 6px 0 4px; }
  .pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--bg2); color: var(--accent); font-weight: 600; font-size: 17px; padding: 13px 10px; border-radius: 12px;
  }
  .pill .ic { width: 20px; height: 20px; }

  .seg { position: relative; display: flex; background: var(--bg2); border-radius: 10px; padding: 2px; margin: 2px 0 8px; --i: 0; }
  .seg-thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3); border-radius: 8px; background: var(--seg-active);
    box-shadow: 0 1px 4px rgba(0,0,0,.18); transform: translateX(calc(var(--i) * 100%)); transition: transform .45s var(--spring);
  }
  .seg button { position: relative; flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 6px 4px; border-radius: 8px; color: var(--sub); transition: color .25s; }
  .seg button.on { color: var(--text); }

  /* ---------- Pochettes ---------- */
  .art {
    aspect-ratio: 1; background-size: cover; background-position: center; border-radius: 6px; overflow: hidden;
    display: grid; place-items: center; color: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.22); flex: none;
  }
  .art .ic { width: 44%; height: 44%; }
  .art.round { border-radius: 50%; }

  /* ---------- Lignes ---------- */
  .row {
    display: flex; align-items: center; gap: 12px; padding: 0 8px; margin: 0 -8px; border-radius: 12px; cursor: pointer;
  }
  .row:hover { background: var(--bg2); }
  .row.current { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .row .lead { position: relative; width: 52px; flex: none; }
  .row .lead .art { width: 52px; }
  .row .lead.num { width: 28px; text-align: center; color: var(--sub); font-size: 16px; font-variant-numeric: tabular-nums; }
  .row-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 0; min-height: 64px; border-bottom: 1px solid var(--line); transition: border-color .2s; }
  .row:hover .row-body, .row.current .row-body { border-bottom-color: transparent; }
  .row .info { flex: 1; min-width: 0; }
  .r-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-sub { font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .r-dur { font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .r-chev { color: var(--sub); transition: transform .3s var(--spring); }
  .row:hover .r-chev { transform: translateX(3px); }
  .r-chev .ic { width: 16px; height: 16px; }
  .row.current .r-title { color: var(--accent); }

  .eq { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.4); border-radius: 6px; }
  .eq .bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { width: 3px; height: 100%; background: #fff; border-radius: 1px; transform: scaleY(.3); transform-origin: bottom; }
  .row.current .eq { display: grid; animation: pop .35s var(--spring); }
  .num .eq { background: none; }
  .num .eq i { background: var(--accent); }
  .row.current .num-n { visibility: hidden; }
  body.is-playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
  body.is-playing .eq i:nth-child(2) { animation-delay: -.35s; animation-duration: .7s; }
  body.is-playing .eq i:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; display: flex; align-items: flex-end; width: 100%; min-height: 210px; margin: 2px 0 4px; padding: 22px;
    border-radius: 24px; color: #fff; overflow: hidden; isolation: isolate; background: var(--hc, #444); cursor: pointer;
    box-shadow: 0 14px 34px color-mix(in srgb, var(--hc, #000) 45%, transparent);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(130% 120% at 100% 0%, rgba(255,255,255,.3), transparent 55%), linear-gradient(165deg, transparent 25%, rgba(0,0,0,.55));
  }
  .hero .h-art {
    position: absolute; right: -16px; top: 50%; width: min(50%, 230px); border-radius: 14px; box-shadow: 0 20px 44px rgba(0,0,0,.5);
    transform: translateY(-52%) rotate(7deg); transition: transform .7s var(--spring);
  }
  .hero:hover .h-art { transform: translateY(-52%) rotate(2deg) scale(1.05); }
  .h-text { max-width: 58%; }
  .h-title { font-size: 27px; font-weight: 800; letter-spacing: -.025em; line-height: 1.08; overflow-wrap: anywhere; }
  .h-sub { margin-top: 5px; opacity: .8; font-size: 15px; }
  .h-play { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #111; font-weight: 700; padding: 10px 18px; border-radius: 999px; }
  .h-play .ic { width: 18px; height: 18px; }

  /* ---------- Cartes et grilles ---------- */
  .scroller { display: flex; gap: 14px; overflow-x: auto; margin: 0 -20px; padding: 8px 20px 16px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .scroller::-webkit-scrollbar { display: none; }
  .card { display: block; width: 100%; min-width: 0; }
  .scroller .card { width: 152px; flex: none; scroll-snap-align: start; }
  .card .art { width: 100%; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,.2); transition: transform .5s var(--spring), box-shadow .4s; }
  @media (hover: hover) {
    .card:hover .art { transform: translateY(-5px) scale(1.03); box-shadow: 0 16px 28px rgba(0,0,0,.28); }
  }
  .card .c-title { font-size: 14.5px; font-weight: 500; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .c-sub { font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; padding-top: 10px; }

  /* ---------- Détail ---------- */
  .back { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; padding: calc(var(--safe-t) + 16px) 0 6px; }
  .back .ic { width: 22px; height: 22px; margin-left: -6px; }
  .detail-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 0 14px; }
  .detail-head .art { width: min(62vw, 250px); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.32); }
  .detail-head .art.round { border-radius: 50%; }
  .detail-head h1 { font-size: 23px; font-weight: 800; letter-spacing: -.02em; margin-top: 18px; }
  .detail-head .d-artist { color: var(--accent); font-size: 20px; margin-top: 2px; }
  .detail-head .d-meta { color: var(--sub); font-size: 13px; margin-top: 4px; }

  /* ---------- Recherche ---------- */
  .searchbar { position: relative; margin-bottom: 6px; }
  .searchbar input {
    width: 100%; border: 0; background: var(--bg2); border-radius: 12px; padding: 11px 12px 11px 40px; font-size: 17px;
    transition: box-shadow .3s, background-color .3s;
  }
  .searchbar input:focus { box-shadow: 0 0 0 2px var(--accent); outline: none; }
  .searchbar input::placeholder { color: var(--sub); }
  .searchbar .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--sub); }
  .hint { color: var(--sub); text-align: center; padding: 56px 20px; line-height: 1.5; animation: swap .4s var(--smooth); }

  /* ---------- État vide ---------- */
  .empty { text-align: center; padding: 56px 24px 24px; }
  .empty .art { width: 112px; margin: 0 auto 24px; border-radius: 26px; background: var(--grad); box-shadow: 0 18px 36px rgba(250,36,60,.38); animation: float 5s ease-in-out infinite; }
  .empty h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .empty p { color: var(--sub); margin: 8px auto 24px; max-width: 340px; line-height: 1.45; }
  .primary { background: var(--grad); color: #fff; font-weight: 700; font-size: 17px; padding: 14px 26px; border-radius: 14px; box-shadow: 0 8px 20px rgba(250,36,60,.32); }
  .danger { color: var(--accent); font-size: 15px; padding: 22px 0 0; }
  .dragging #main { outline: 3px dashed var(--accent); outline-offset: -10px; }

  /* ---------- Mini-lecteur ---------- */
  .mini {
    position: fixed; z-index: 25; left: 8px; right: 8px; bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
    height: var(--mini-h); display: flex; align-items: center; gap: 2px; padding: 0 6px 0 8px; border-radius: 16px;
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    box-shadow: 0 8px 28px rgba(0,0,0,.2), 0 0 0 1px var(--line);
    animation: rise .6s var(--spring) backwards; transition: transform .5s var(--smooth), opacity .35s;
  }
  body.sheet-open .mini { transform: translateY(24px) scale(.96); opacity: 0; pointer-events: none; }
  .mini-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; height: 100%; touch-action: pan-x; }
  .mini-open .art { width: 44px; border-radius: 7px; }
  .mini-title { font-size: 15px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-sub { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ctl { width: 44px; height: 44px; display: grid; place-items: center; }
  .mini .ctl .ic { width: 26px; height: 26px; }
  .mini-prog { position: absolute; left: 16px; right: 16px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; pointer-events: none; }
  .mini-prog b { display: block; height: 100%; background: var(--accent); transform: scaleX(var(--p, 0)); transform-origin: left; }
  @media (min-width: 900px) { .mini { left: 248px; right: 16px; bottom: 16px; } }

  /* Bouton lecture / pause qui se transforme */
  .pp { display: grid; place-items: center; }
  .pp > span { grid-area: 1 / 1; display: grid; place-items: center; transition: transform .45s var(--spring), opacity .25s; }
  .pp .i-pause { opacity: 0; transform: scale(.4) rotate(-40deg); }
  body.is-playing .pp .i-play { opacity: 0; transform: scale(.4) rotate(40deg); }
  body.is-playing .pp .i-pause { opacity: 1; transform: none; }

  /* ---------- Lecture en cours ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 50; color: #fff; transform: translateY(104%); visibility: hidden; overflow: hidden;
    transition: transform .6s var(--smooth), visibility 0s .6s; will-change: transform; background: #111;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .6s var(--smooth), visibility 0s; }
  .sheet.dragging { transition: none; }
  .sheet-bg { position: absolute; inset: 0; background: var(--sheet-bg, #3a3a3c); transition: background-color .9s; overflow: hidden; }
  .bg-layer {
    position: absolute; inset: -28%; opacity: 0; filter: blur(60px) saturate(1.7);
    transition: opacity 1.1s; animation: drift 26s ease-in-out infinite alternate; animation-play-state: paused;
  }
  #bgB { animation-duration: 33s; animation-direction: alternate-reverse; }
  .bg-layer.on { opacity: .9; }
  body.is-playing .sheet.open .bg-layer { animation-play-state: running; }
  .sheet-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.52)); }
  .sheet-inner {
    position: relative; height: 100%; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column;
    padding: calc(var(--safe-t) + 6px) 28px calc(var(--safe-b) + 18px);
  }
  .grab { align-self: center; padding: 12px 40px; touch-action: none; }
  .grab::before { content: ""; display: block; width: 42px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.45); transition: width .3s var(--spring), background-color .3s; }
  .grab:hover::before { width: 56px; background: rgba(255,255,255,.7); }
  .cover-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 0 14px; touch-action: none; }
  .cover { width: min(100%, 44vh, 380px); transform: scale(.82); transition: transform .7s var(--spring); }
  body.is-playing .cover { transform: scale(1); }
  .cover-pulse { position: relative; }
  .cover-pulse .art { position: relative; z-index: 1; width: 100%; border-radius: 14px; box-shadow: 0 26px 54px rgba(0,0,0,.45); }
  .cover-pulse .glow { position: absolute; z-index: 0; inset: 10%; border-radius: 20px; filter: blur(36px); opacity: .3; transform: scale(1.06); box-shadow: none; }
  body.is-playing .cover-pulse .glow { animation: breathe 3.8s ease-in-out infinite; }
  .s-titles { padding-bottom: 14px; min-height: 64px; touch-action: none; }
  .s-title { font-size: 23px; font-weight: 750; letter-spacing: -.015em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-artist { font-size: 20px; color: rgba(255,255,255,.7); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--bg2); color: var(--sub); flex: none; }
  .s-fmt { margin-top: 8px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.62); }
  .s-fmt:not(:empty) { display: inline-block; padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,.14); }
  .s-fmt.lossless { color: #fff; background: rgba(255,255,255,.26); }

  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; --pct: 0%; }
  .range::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(to right, rgba(255,255,255,.95) var(--pct), rgba(255,255,255,.28) var(--pct)); transition: height .25s var(--spring); }
  .range::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(255,255,255,.28); }
  .range::-moz-range-progress { height: 5px; border-radius: 5px; background: rgba(255,255,255,.95); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 0; height: 0; border-radius: 50%; background: #fff; margin-top: 2.5px; border: 0; }
  .range::-moz-range-thumb { width: 0; height: 0; border-radius: 50%; background: #fff; border: 0; }
  .range:active::-webkit-slider-runnable-track, .range:focus-visible::-webkit-slider-runnable-track { height: 10px; }
  .range:active::-webkit-slider-thumb, .range:focus-visible::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -3px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .range:active::-moz-range-thumb { width: 16px; height: 16px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.65); font-variant-numeric: tabular-nums; margin-top: -2px; }

  .s-controls { display: flex; align-items: center; justify-content: center; gap: 34px; padding: 14px 0 10px; }
  .s-controls button { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; }
  .s-controls .ic { width: 38px; height: 38px; }
  .s-controls .big .ic { width: 60px; height: 60px; }
  #s-next:active .ic { transform: translateX(4px); }
  #s-prev:active .ic { transform: translateX(-4px); }
  .s-controls .ic { transition: transform .25s var(--spring); }

  .s-volume { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.7); padding: 4px 0 8px; }
  .s-volume .ic { width: 18px; height: 18px; }
  .s-foot { display: flex; justify-content: space-around; padding-top: 6px; }
  .s-foot button { width: 54px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: rgba(255,255,255,.7); }
  .s-foot button.on { background: rgba(255,255,255,.26); color: #fff; }
  .s-foot .ic { width: 22px; height: 22px; }

  .queue { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px 8px; padding: 0 8px; display: none; scrollbar-width: none; }
  .queue::-webkit-scrollbar { display: none; }
  .sheet.show-queue .queue { display: block; animation: swap .4s var(--smooth); }
  .sheet.show-queue .cover-wrap { display: none; }
  .cover-wrap { animation: swap .45s var(--smooth); }
  .queue h3 { font-size: 16px; font-weight: 700; margin: 12px 0 6px; }
  .q-row { display: flex; align-items: center; gap: 12px; padding: 7px 8px; margin: 0 -8px; border-radius: 12px; cursor: pointer; width: calc(100% + 16px); transition: background-color .2s, transform .3s var(--spring); }
  .q-row:hover { background: rgba(255,255,255,.14); }
  .q-row:active { transform: scale(.975); }
  .q-row .art { width: 44px; border-radius: 6px; }
  .q-row .q-t { font-size: 15px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-row .q-a { font-size: 13px; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-row .q-i { min-width: 0; }

  .toast {
    position: fixed; z-index: 70; left: 50%; top: calc(var(--safe-t) + 14px); transform: translate(-50%, -160%) scale(.9);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 550;
    transition: transform .5s var(--spring); max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show { transform: translate(-50%, 0) scale(1); }

  /* ---------- Fenêtres (ajout et import d'album) ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; visibility: hidden; transition: visibility 0s .55s; }
  .modal.open { visibility: visible; transition: visibility 0s; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; transition: opacity .45s; }
  .modal.open .modal-backdrop { opacity: 1; }
  .modal-card {
    position: relative; width: 100%; max-width: 520px; max-height: 90vh; display: flex; flex-direction: column; isolation: isolate; overflow: hidden;
    background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 18px calc(var(--safe-b) + 18px);
    box-shadow: 0 -10px 50px rgba(0,0,0,.35); transform: translateY(104%); transition: transform .6s var(--smooth);
  }
  .modal.open .modal-card { transform: none; }
  .modal-grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; flex: none; }
  .modal-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 2px 12px; }
  @media (min-width: 700px) {
    .modal { align-items: center; }
    .modal-card { border-radius: 28px; padding-bottom: 22px; transform: translateY(40px) scale(.95); opacity: 0; transition: transform .55s var(--spring), opacity .35s; }
    .modal.open .modal-card { opacity: 1; }
  }

  .opt { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 18px; background: var(--bg2); transition: transform .3s var(--spring), background-color .25s; }
  .opt:hover { background: color-mix(in srgb, var(--accent) 9%, var(--bg2)); }
  .opt:active { transform: scale(.97); }
  .opt-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 14px rgba(250,36,60,.28); }
  .opt-ic .ic { width: 24px; height: 24px; }
  .opt-tx { min-width: 0; }
  .opt-tx b { display: block; font-size: 16.5px; font-weight: 650; }
  .opt-tx small { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.3; }
  .modal-cancel { width: 100%; text-align: center; padding: 14px; margin-top: 2px; color: var(--accent); font-weight: 650; font-size: 17px; }

  .review::before {
    content: ""; position: absolute; inset: -20px; z-index: -1; background: var(--rvc, none) center / cover; filter: blur(46px) saturate(1.7);
    opacity: .3; transition: opacity .6s;
  }
  .rv-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex: none; }
  .rv-cover { position: relative; width: 108px; height: 108px; flex: none; border-radius: 14px; overflow: hidden; display: grid; place-items: center; color: rgba(255,255,255,.9); box-shadow: 0 10px 26px rgba(0,0,0,.3); transition: transform .35s var(--spring); }
  .rv-cover:active { transform: scale(.95); }
  .rv-cover .ic { width: 40%; height: 40%; }
  .rv-edit { position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .rv-fields { flex: 1; min-width: 0; }
  .rv-fields input { width: 100%; background: transparent; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 7px 0; transition: border-color .25s; }
  .rv-fields input:focus { outline: none; border-bottom-color: var(--accent); }
  #rv-title { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  #rv-artist { font-size: 17px; color: var(--accent); margin-top: 4px; }
  .rv-fields input::placeholder { color: var(--sub); font-weight: 500; }
  .rv-meta { margin-top: 8px; font-size: 13px; color: var(--sub); }
  .rv-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px 14px; padding: 0 6px; border-top: 1px solid var(--line); scrollbar-width: none; }
  .rv-list::-webkit-scrollbar { display: none; }
  .rv-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .rv-n { width: 26px; text-align: center; color: var(--sub); font-variant-numeric: tabular-nums; font-size: 15px; flex: none; }
  .rv-t { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-actions { display: flex; gap: 10px; flex: none; }
  .ghost { flex: 1; background: var(--bg2); border-radius: 14px; padding: 14px; font-weight: 650; font-size: 17px; text-align: center; transition: transform .3s var(--spring); }
  .ghost:active { transform: scale(.95); }
  .rv-actions .primary { flex: 1.7; }
  .rv-actions .primary:active { transform: scale(.95); }
  .rv-actions .primary.busy { opacity: .6; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {

<script>
(function () {

    prev: '<path d="M19.5 6.4v11.2a.5.5 0 0 1-.8.4l-7.2-5.6a.5.5 0 0 1 0-.8L18.7 6a.5.5 0 0 1 .8.4zM12 6.4v11.2a.5.5 0 0 1-.8.4L4 12.4a.5.5 0 0 1 0-.8L11.2 6a.5.5 0 0 1 .8.4z"/>',

    left: `<path d="M15 5l-7 7 7 7" ${S} stroke-width="2.3"/>`,

    album: `<rect x="3.5" y="3.5" width="17" height="17" rx="4" ${S}/><circle cx="12" cy="12" r="3.6" ${S}/><circle cx="12" cy="12" r=".9"/>`,
    folder: `<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" ${S}/>`,
    zip: `<path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.500a1 1 0 0 1 1-1z" ${S}/><path d="M12 8.5v1.500M12 12v1.500M12 15.500v1.500" ${S}/>`,
    songs: `<path d="M9 17.5V6.5l10-2v11" ${S} stroke-width="2"/><circle cx="6.8" cy="17.5" r="2.4"/><circle cx="16.8" cy="15.5" r="2.4"/>`,
    note: `<path d="M9 17.5V6.5l10-2v11" ${S} stroke-width="2"/><circle cx="6.8" cy="17.5" r="2.4"/><circle cx="16.8" cy="15.5" r="2.4"/>`,
    home: `<circle cx="12" cy="12" r="8.6" ${S}/><path d="M10 8.6v6.8a.4.4 0 0 0 .6.3l5.6-3.4a.4.4 0 0 0 0-.7l-5.6-3.4a.4.4 0 0 0-.6.4z"/>`,
    library: `<path d="M4 7h9M4 12h9M4 17h5" ${S}/><path d="M18.5 16V6l2.5.8" ${S}/><circle cx="16.6" cy="16.4" r="2.2"/>`,
    shuffle: `<path d="M3 7h3.2c1.6 0 3 .8 3.8 2.1l3.9 5.8c.8 1.3 2.2 2.1 3.8 2.1H21M3 17h3.2c1.6 0 3-.8 3.8-2.1M13.9 9.1c.8-1.3 2.2-2.1 3.8-2.1H21M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5" ${S}/>`,
    repeat: `<path d="M17 2.5l3 3-3 3M4 11V9.5a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 13v1.5a4 4 0 0 1-4 4H4" ${S}/>`,
    repeat1: `<path d="M17 2.5l3 3-3 3M4 11V9.5a4 4 0 0 1 4-4h12M7 21.5l-3-3 3-3M20 13v1.5a4 4 0 0 1-4 4H4" ${S}/><path d="M11 10.5l1.6-1v6" ${S} stroke-width="1.7"/>`,
    queue: `<path d="M4 6.5h16M4 12h16M4 17.5h8" ${S}/><path d="M16 15.5v4l3.5-2z"/>`,
    'vol-low': '<path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/>',
    'vol-high': `<path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" ${S}/>`
  };
  const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
  const ppHTML = () => `<span class="i-play">${icon('play')}</span><span class="i-pause">${icon('pause')}</span>`;

  const AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba|webm|mp4)$/i;
  const collator = new Intl.Collator('fr', { sensitivity: 'base', numeric: true });
  const TAB_NAMES = { home: 'Écouter', library: 'Bibliothèque', search: 'Recherche' };
  const SEGS = [['songs', 'Morceaux'], ['albums', 'Albums'], ['artists', 'Artistes']];

  const state = {
    tracks: [], tab: 'home', seg: 'songs', detail: null, query: '',
    queue: [], orig: [], pos: -1, shuffle: false, repeat: 'off', nextId: 1, confirmClear: false, fkeys: new Set()
  };

  /* ---------- Utilitaires ---------- */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function iconEl(name) { const s = document.createElement('span'); s.style.display = 'contents'; s.innerHTML = icon(name); return s; }
  function hueOf(str) { let h = 7; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h % 360; }
  function fmt(s) { if (!isFinite(s) || s < 0) return '0:00'; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const byId = (id) => state.tracks.find((t) => t.id === id);
  const curTrack = () => byId(state.queue[state.pos]);
  const plural = (n, a, b) => n + ' ' + (n > 1 ? b : a);
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms || 6); } catch (e) {} };
  function setBar(r) { r.style.setProperty('--pct', ((r.value - r.min) / (r.max - r.min)) * 100 + '%'); }
  function anim(node, frames, opts) { if (reduced || !node || !node.animate) return; try { node.animate(frames, opts); } catch (e) {} }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- Pochettes ---------- */
  function art(t, extra) {
    const d = el('div', 'art' + (extra ? ' ' + extra : ''));
    if (t && t.cover) d.style.backgroundImage = 'url("' + t.cover + '")';
    else {
      const h = t ? t.hue : 350;
      d.style.background = `linear-gradient(145deg, hsl(${h} 78% 64%), hsl(${(h + 45) % 360} 72% 42%))`;
      d.innerHTML = icon('note');
    }
    return d;
  }
  function avatar(name, hue, big) {
    const d = el('div', 'art round');
    d.style.background = `linear-gradient(145deg, hsl(${hue} 70% 62%), hsl(${(hue + 40) % 360} 65% 42%))`;
    const i = el('span', null, (name.trim()[0] || '♪').toUpperCase());
    i.style.fontWeight = '700'; i.style.fontSize = big ? '72px' : '20px';
    d.append(i); return d;
  }

  /* ---------- Lecture des morceaux ---------- */
  function readTags(f) {
    return new Promise((res) => {
      if (!window.jsmediatags) return res(null);
      try { window.jsmediatags.read(f, { onSuccess: (d) => res(d.tags), onError: () => res(null) }); }
      catch (e) { res(null); }
    });
  }
  function coverColors(url, hue) {
    const fb = { dark: `hsl(${hue} 45% 28%)`, vivid: `hsl(${hue} 62% 42%)` };
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas'); c.width = c.height = 8;
          const x = c.getContext('2d'); x.drawImage(img, 0, 0, 8, 8);
          const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          const n = d.length / 4; r /= n; g /= n; b /= n;
          const k = (m) => `rgb(${Math.round(r * m)}, ${Math.round(g * m)}, ${Math.round(b * m)})`;
          res({ dark: k(.6), vivid: k(.88) });
        } catch (e) { res(fb); }
      };
      img.onerror = () => res(fb);
      setTimeout(() => res(fb), 3000);
      img.src = url;
    });
  }
  async function buildTrack(f) {
    const base = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
    let title = base, artist = null, album = null, cover = null, num = null;
    const m = base.match(/^(.+?)\s+-\s+(.+)$/);
    if (m) {
      if (/^\d{1,3}$/.test(m[1].trim())) { num = parseInt(m[1], 10); title = m[2].trim(); }
      else { artist = m[1].trim(); title = m[2].trim(); }
    }
    title = title.replace(/^\d{1,3}[\s.\-]+(?=\D)/, '') || title;
    const tag = await readTags(f);
    if (tag) {
      if (tag.title) title = String(tag.title);
      if (tag.artist) artist = String(tag.artist);
      if (tag.album) album = String(tag.album);
      if (tag.track) num = parseInt(String(tag.track), 10) || null;
      if (tag.picture && tag.picture.data) {
        try { cover = URL.createObjectURL(new Blob([new Uint8Array(tag.picture.data)], { type: tag.picture.format || 'image/jpeg' })); } catch (e) {}
      }
    }
    const albumKnown = !!album;
    const artistKnown = !!artist;
    const ext = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
    const lossless = ['flac', 'wav', 'aif', 'aiff', 'alac'].includes(ext);
    artist = artist || 'Artiste inconnu';
    album = album || 'Album inconnu';
    const hue = hueOf(album + '|' + artist);
    const t = {
      id: state.nextId++, url: URL.createObjectURL(f), title, artist, album, cover, num, hue, dur: 0, ext, lossless, albumKnown, artistKnown, fname: f.name, fkey: f.name + '|' + f.size,
      akey: albumKnown ? album : '?|' + artist, added: 0, bg: null, vivid: null
    };
    const c = cover ? await coverColors(cover, hue) : { dark: `hsl(${hue} 45% 28%)`, vivid: `hsl(${hue} 62% 42%)` };
    t.bg = c.dark; t.vivid = c.vivid;
    return t;
  }
  function loadDuration(t) {
    const a = new Audio(); a.preload = 'metadata';
    a.addEventListener('loadedmetadata', () => { t.dur = a.duration; a.removeAttribute('src'); updateDurations(); }, { once: true });
    a.src = t.url;
  }
  function updateDurations() {
    document.querySelectorAll('[data-dur]').forEach((n) => { const t = byId(+n.dataset.dur); if (t && t.dur) n.textContent = fmt(t.dur); });
  }

  const IMG_EXT = /\.(jpe?g|png|webp|gif|avif)$/i;
  const ZIP_EXT = /\.zip$/i;
  const MIME = { mp3: 'audio/mpeg', flac: 'audio/flac', wav: 'audio/wav', m4a: 'audio/mp4', aac: 'audio/aac', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', weba: 'audio/webm', webm: 'audio/webm', mp4: 'audio/mp4', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif' };
  const extOf = (n) => ((n.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
  const isZip = (f) => ZIP_EXT.test(f.name) || f.type === 'application/zip' || f.type === 'application/x-zip-compressed';
  const isAudio = (f) => (f.type || '').startsWith('audio/') || AUDIO_EXT.test(f.name);
  const isImage = (f) => (f.type || '').startsWith('image/') || IMG_EXT.test(f.name);

  /* Ouvre les archives, trie audio et images */
  async function expand(files) {
    const audio = [], images = []; let hint = null;
    for (const f of Array.from(files)) {
      if (isZip(f)) {
        if (!window.JSZip) { toast('Lecture des archives indisponible'); continue; }
        try {
          const zip = await window.JSZip.loadAsync(f);
          hint = hint || f.name.replace(/\.zip$/i, '');
          for (const e of Object.values(zip.files)) {
            const base = e.name.split('/').pop();
            if (e.dir || e.name.startsWith('__MACOSX/') || base.startsWith('.')) continue;
            const mime = MIME[extOf(base)]; if (!mime) continue;
            const data = await e.async('uint8array');
            (mime.startsWith('audio/') ? audio : images).push(new File([data], base, { type: mime }));
          }
        } catch (err) { toast('Archive illisible : ' + f.name); }
      } else if (isAudio(f)) {
        const rel = f.webkitRelativePath || '';
        if (rel.includes('/') && !hint) hint = rel.split('/')[0];
        audio.push(f);
      } else if (isImage(f)) images.push(f);
    }
    return { audio, images, hint };
  }

  async function importFiles(files, mode) {
    const list = Array.from(files); if (!list.length) return;
    if (list.some(isZip)) mode = 'album';
    toast('Lecture des fichiers…');
    const { audio, images, hint } = await expand(list);
    if (!audio.length) { toast('Aucun fichier audio trouvé'); return; }
    const fresh = audio.filter((f) => !state.fkeys.has(f.name + '|' + f.size));
    if (!fresh.length) { toast('Déjà dans ta bibliothèque'); return; }
    fresh.sort((a, b) => collator.compare(a.name, b.name));
    const tracks = await Promise.all(fresh.map(buildTrack));
    if (mode === 'direct') commit(tracks); else openReview({ tracks, images, hint });
  }

  function commit(tracks, openAlbum) {
    const now = Date.now();
    tracks.forEach((t, i) => { t.added = now + i; state.tracks.push(t); state.fkeys.add(t.fkey); loadDuration(t); });
    toast(openAlbum ? 'Album ajouté' : plural(tracks.length, 'morceau ajouté', 'morceaux ajoutés'));
    if (openAlbum) { state.detail = { type: 'album', key: openAlbum }; window.scrollTo(0, 0); render('push'); }
    else if (state.tab === 'search' && !state.detail) renderResults(); else render('tab');
  }

  /* ---------- Fenêtres ---------- */
  function openModal(id) {
    const m = $('#' + id); m.inert = false; m.classList.add('open');
    m.querySelectorAll('[data-stagger]').forEach((n, i) =>
      anim(n, [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 140 + i * 60, easing: SM, fill: 'backwards' }));
  }
  function closeModal(id) { const m = $('#' + id); m.classList.remove('open'); m.inert = true; }
  function openAdd() { openModal('add-modal'); }

  let review = null;
  function mostCommon(arr) {
    const m = new Map(); arr.filter(Boolean).forEach((x) => m.set(x, (m.get(x) || 0) + 1));
    let best = null, n = 0; m.forEach((c, k) => { if (c > n) { n = c; best = k; } }); return best;
  }
  function pickCover(images) {
    if (!images.length) return null;
    return images.find((f) => /(cover|folder|front|album|pochette|artwork)/i.test(f.name)) || images.slice().sort((a, b) => b.size - a.size)[0];
  }
  function paintCover() {
    const b = $('#rv-cover'), r = review; b.innerHTML = '';
    if (r.coverUrl) b.style.background = `center / cover url("${r.coverUrl}")`;

  /* ---------- Regroupements ---------- */
  function getAlbums() {
    const m = new Map();

    const arr = [...m.values()];
    arr.forEach((a) => {
      a.tracks.sort((x, y) => (x.num || 999) - (y.num || 999) || collator.compare(x.title, y.title));
      a.artist = new Set(a.tracks.map((t) => t.artist)).size === 1 ? a.tracks[0].artist : 'Artistes divers';

  function getArtists() {

  /* ---------- Lecture ---------- */
  function startPlayback(list, i, forceShuffle) {
    if (!list.length) return;
    const ids = list.map((t) => t.id);
    state.orig = ids.slice();
    if (forceShuffle) state.shuffle = true;
    if (state.shuffle) {
      const cur = forceShuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[i];
      state.queue = [cur, ...shuffleArr(ids.filter((x) => x !== cur))]; state.pos = 0;
    } else { state.queue = ids.slice(); state.pos = i; }
    loadCurrent(0); updateModes(); buzz(8);
  }
  function loadCurrent(dir) {
    const t = curTrack(); if (!t) return;
    audio.src = t.url; audio.play().catch(() => {}); onTrackChange(dir || 0);
  }
  function next(auto) {
    if (!state.queue.length) return;
    if (state.pos < state.queue.length - 1) { state.pos++; loadCurrent(1); }
    else if (state.repeat === 'all') {
      if (state.shuffle) { const cur = state.queue[state.pos]; state.queue = shuffleArr(state.orig); state.pos = 0; if (state.queue.length > 1 && state.queue[0] === cur) { [state.queue[0], state.queue[1]] = [state.queue[1], state.queue[0]]; } }
      else state.pos = 0;
      loadCurrent(1);
    } else if (auto) { audio.pause(); audio.currentTime = 0; }
  }
  function prev() {
    if (!state.queue.length) return;

    state.pos--; loadCurrent(-1);
  }
  function togglePlay() {

    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  }
  function setShuffle(on) {

    if (state.queue.length) {

      else { state.queue = state.orig.slice(); state.pos = Math.max(0, state.queue.indexOf(cur)); }

  }
  function cycleRepeat() { state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off'; updateModes(); }

  function clearAll() {

  /* ---------- Interface du lecteur ---------- */
  function refreshPlaying() {
    const cur = state.queue[state.pos];
    document.querySelectorAll('.row[data-id]').forEach((r) => r.classList.toggle('current', +r.dataset.id === cur));
  }
  let bgOn = 1;
  function setBg(t) {
    const layers = [$('#bgA'), $('#bgB')];
    const nxt = layers[bgOn ^ 1], cur = layers[bgOn];
    nxt.style.background = t.cover
      ? `center / cover url("${t.cover}")`
      : `linear-gradient(145deg, hsl(${t.hue} 80% 55%), hsl(${(t.hue + 60) % 360} 75% 38%))`;
    nxt.classList.add('on'); cur.classList.remove('on'); bgOn ^= 1;
  }
  function onTrackChange(dir) {
    const t = curTrack(); if (!t) return;
    const first = $('#mini').classList.contains('hidden');
    $('#mini').classList.remove('hidden'); document.body.classList.add('has-mini');
    document.body.style.setProperty('--tint', t.vivid || t.bg);
    const ma = $('#mini-art'); ma.innerHTML = ''; ma.append(art(t));
    $('#mini-title').textContent = t.title; $('#mini-sub').textContent = t.artist;
    const pulse = $('#pulse'); pulse.innerHTML = '';
    const glow = art(t, 'glow'); glow.innerHTML = ''; pulse.append(glow, art(t));
    $('#s-title').textContent = t.title; $('#s-artist').textContent = t.artist;
    const sf = $('#s-fmt'); sf.textContent = t.ext ? t.ext.toUpperCase() + (t.lossless ? ' · Lossless' : '') : ''; sf.classList.toggle('lossless', !!t.lossless);
    $('#sheet').style.setProperty('--sheet-bg', t.bg); setBg(t);
    $('#seek').value = 0; setBar($('#seek')); $('#t-cur').textContent = '0:00'; $('#t-rem').textContent = '-0:00';
    document.documentElement.style.setProperty('--p', 0); $('.mini-prog b').style.setProperty('--p', 0);
    document.title = t.title + ' · ' + t.artist;
    refreshPlaying(); renderQueue();
    if (!first) {
      const x = dir === 0 ? 0 : dir;
      const frames = (px) => [{ opacity: 0, transform: `translateX(${x * px}px) scale(${x ? 1 : .94})` }, { opacity: 1, transform: 'none' }];
      anim(pulse, frames(70), { duration: 650, easing: SM });
      anim($('#s-title'), frames(26), { duration: 520, easing: SM });
      anim($('#s-artist'), frames(26), { duration: 600, easing: SM });
      anim(ma.firstChild, frames(16), { duration: 480, easing: SM });
    }
    if ('mediaSession' in navigator) {
      const meta = { title: t.title, artist: t.artist, album: t.album };
      if (t.cover) meta.artwork = [{ src: t.cover, sizes: '512x512' }];
      try { navigator.mediaSession.metadata = new MediaMetadata(meta); } catch (e) {}
    }
  }
  function renderQueue() {
    const box = $('#queue'); box.innerHTML = '';
    if (!state.queue.length) return;
    const mk = (id, i) => {
      const t = byId(id); if (!t) return null;
      const b = el('button', 'q-row'); b.append(art(t));
      const info = el('div', 'q-i'); info.append(el('div', 'q-t', t.title), el('div', 'q-a', t.artist)); b.append(info);
      b.addEventListener('click', () => { const d = i > state.pos ? 1 : -1; state.pos = i; loadCurrent(d); }); return b;
    };
    box.append(el('h3', null, 'En lecture'));
    const c = mk(state.queue[state.pos], state.pos); if (c) box.append(c);
    if (state.pos < state.queue.length - 1) {
      box.append(el('h3', null, 'À suivre'));
      for (let i = state.pos + 1; i < state.queue.length; i++) { const r = mk(state.queue[i], i); if (r) box.append(r); }
    }
  }
  function updateModes() {
    const sh = $('#b-shuffle'), rp = $('#b-repeat');
    sh.classList.toggle('on', state.shuffle); sh.setAttribute('aria-pressed', String(state.shuffle));
    rp.classList.toggle('on', state.repeat !== 'off'); rp.setAttribute('aria-pressed', String(state.repeat !== 'off'));
    rp.innerHTML = icon(state.repeat === 'one' ? 'repeat1' : 'repeat');
    rp.setAttribute('aria-label', 'Répétition : ' + { off: 'désactivée', all: 'toute la liste', one: 'ce morceau' }[state.repeat]);
  }
  function setPlayIcons(playing) {
    const label = playing ? 'Pause' : 'Lecture';
    ['#mini-play', '#s-play'].forEach((s) => $(s).setAttribute('aria-label', label));
    document.body.classList.toggle('is-playing', playing);
  }

  let justDragged = false;
  function openSheet() {
    if (!state.queue.length) return;
    const s = $('#sheet'); if (s.classList.contains('open')) return;
    s.inert = false; s.classList.add('open'); document.body.classList.add('sheet-open');
    anim($('#cover-wrap'), [{ transform: 'translate(-26%, 62%) scale(.26)', opacity: .25 }, { transform: 'none', opacity: 1 }], { duration: 720, easing: 'cubic-bezier(.2,1,.3,1)' });
    ['s-titles', 'seek', 'times', 's-controls', 's-volume', 's-foot'].forEach((id, i) =>
      anim($('#' + id), [{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 140 + i * 55, easing: SM, fill: 'backwards' }));
    try { $('#sheet-close').focus({ preventScroll: true }); } catch (e) {}
  }
  function closeSheet() {
    const s = $('#sheet'); s.classList.remove('open', 'show-queue'); s.inert = true; s.style.transform = '';
    document.body.classList.remove('sheet-open');
    $('#b-queue').classList.remove('on'); $('#b-queue').setAttribute('aria-pressed', 'false');
  }

  /* Glisser vers le bas pour fermer */
  (function () {
    const sheet = $('#sheet'), zone = $('#sheet-inner');
    let sy = 0, dy = 0, dragging = false, t0 = 0, pid = null;
    zone.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      if (e.target.closest('input, .queue, .s-controls, .s-foot, .s-volume')) return;
      if (e.target.closest('button') && !e.target.closest('.grab')) return;
      dragging = true; sy = e.clientY; dy = 0; t0 = performance.now(); pid = e.pointerId;
    });
    window.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid) return;
      dy = Math.max(0, e.clientY - sy);
      if (dy > 6) {
        sheet.classList.add('dragging');
        const k = dy > 0 ? dy * (1 - Math.min(dy / 1600, .35)) : 0;
        sheet.style.transform = `translateY(${k}px)`;
        const p = Math.min(dy / 500, 1);
        document.body.style.setProperty('--drag', p);
      }
    });
    const end = (e) => {
      if (!dragging || (e && e.pointerId !== pid)) return;
      dragging = false;
      const moved = dy > 6; const v = dy / Math.max(1, performance.now() - t0);
      sheet.classList.remove('dragging');
      if (moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 60); }
      if (dy > 140 || (v > .6 && dy > 40)) closeSheet(); else sheet.style.transform = '';
      dy = 0;
    };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  })();

  /* Glisser vers le haut sur le mini-lecteur pour ouvrir */
  (function () {
    const mo = $('#mini-open'); let sy = 0, on = false;
    mo.addEventListener('pointerdown', (e) => { sy = e.clientY; on = true; });
    window.addEventListener('pointerup', (e) => { if (on && sy - e.clientY > 24) { openSheet(); justDragged = true; setTimeout(() => { justDragged = false; }, 60); } on = false; });
  })();

  /* ---------- Événements ---------- */
  let seeking = false;
  audio.addEventListener('play', () => setPlayIcons(true));
  audio.addEventListener('pause', () => setPlayIcons(false));
  audio.addEventListener('ended', () => { if (state.repeat === 'one') { audio.currentTime = 0; audio.play(); } else next(true); });
  audio.addEventListener('error', () => { if (state.queue.length) toast('Ce fichier ne peut pas être lu ici'); });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    $('.mini-prog b').style.setProperty('--p', (audio.currentTime / audio.duration).toFixed(4));
    if (seeking) return;
    $('#t-cur').textContent = fmt(audio.currentTime);
    $('#t-rem').textContent = '-' + fmt(audio.duration - audio.currentTime);
    $('#seek').value = (audio.currentTime / audio.duration) * 1000; setBar($('#seek'));
  });
  audio.addEventListener('loadedmetadata', () => { const t = curTrack(); if (t && !t.dur) { t.dur = audio.duration; updateDurations(); } });

  const seek = $('#seek');
  seek.addEventListener('input', () => { seeking = true; setBar(seek); if (audio.duration) { const x = (seek.value / 1000) * audio.duration; $('#t-cur').textContent = fmt(x); $('#t-rem').textContent = '-' + fmt(audio.duration - x); } });
  seek.addEventListener('change', () => { if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration; seeking = false; });
  const vol = $('#vol'); vol.addEventListener('input', () => { audio.volume = vol.value / 100; setBar(vol); });

  $('#mini-open').addEventListener('click', () => { if (!justDragged) openSheet(); });
  $('#mini-play').addEventListener('click', togglePlay);
  $('#mini-next').addEventListener('click', () => next(false));
  $('#s-play').addEventListener('click', togglePlay);
  $('#s-next').addEventListener('click', () => next(false));
  $('#s-prev').addEventListener('click', prev);
  $('#sheet-close').addEventListener('click', () => { if (!justDragged) closeSheet(); });
  $('#b-shuffle').addEventListener('click', () => setShuffle(!state.shuffle));
  $('#b-repeat').addEventListener('click', cycleRepeat);
  $('#b-queue').addEventListener('click', () => {
    const s = $('#sheet'); const on = s.classList.toggle('show-queue');
    $('#b-queue').classList.toggle('on', on); $('#b-queue').setAttribute('aria-pressed', String(on));
    if (on) { renderQueue(); const q = $('#queue'); q.querySelectorAll('.q-row').forEach((r, i) => anim(r, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: Math.min(i, 10) * 35, easing: SM, fill: 'backwards' })); }
  });
  document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab, b)));
  window.addEventListener('scroll', () => { $('#topbar').classList.toggle('on', window.scrollY > 54); }, { passive: true });

  const wire = (id, mode) => { const inp = $('#' + id); inp.addEventListener('change', () => { const f = Array.from(inp.files); inp.value = ''; closeModal('add-modal'); importFiles(f, mode); }); };
  wire('file', 'direct'); wire('file-album', 'album'); wire('file-folder', 'album'); wire('file-zip', 'album');
  $('#opt-songs').addEventListener('click', () => $('#file').click());
  $('#opt-album').addEventListener('click', () => $('#file-album').click());
  $('#opt-folder').addEventListener('click', () => $('#file-folder').click());
  $('#opt-zip').addEventListener('click', () => $('#file-zip').click());
  document.querySelectorAll('[data-close]').forEach((n) => n.addEventListener('click', () => closeModal(n.dataset.close)));
  $('#rv-backdrop').addEventListener('click', cancelReview);
  $('#rv-cancel').addEventListener('click', cancelReview);
  $('#rv-confirm').addEventListener('click', confirmReview);
  $('#rv-cover').addEventListener('click', () => $('#file-cover').click());
  $('#file-cover').addEventListener('change', () => {
    const f = $('#file-cover').files[0]; $('#file-cover').value = '';
    if (!f || !review || !isImage(f)) return;
    if (review.coverIsNew && review.coverUrl) URL.revokeObjectURL(review.coverUrl);
    review.coverUrl = URL.createObjectURL(f); review.coverIsNew = true; paintCover();
    anim($('#rv-cover'), [{ transform: 'scale(.86)', opacity: .5 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.34,1.45,.52,1)' });
  });
  $('#rv-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#rv-artist').focus(); } });
  $('#rv-artist').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove('dragging'); }));
  document.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files, 'direct'); });

  document.addEventListener('keydown', (e) => {
    const tag = e.target.tagName;
    if (e.key === 'Escape') { if ($('#review-modal').classList.contains('open')) cancelReview(); else if ($('#add-modal').classList.contains('open')) closeModal('add-modal'); else closeSheet(); return; }
    if (tag === 'INPUT' || tag === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && e.shiftKey) next(false);
    if (e.code === 'ArrowLeft' && e.shiftKey) prev();
  });

  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', () => audio.play());
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('nexttrack', () => next(false));
      ms.setActionHandler('previoustrack', prev);
      ms.setActionHandler('seekto', (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
    } catch (e) {}
  }

  /* ---------- Démarrage ---------- */
  document.querySelectorAll('[data-icon]').forEach((n) => { n.innerHTML = icon(n.dataset.icon); });
  $('#mini-play').innerHTML = ppHTML(); $('#s-play').innerHTML = ppHTML();
  $('#s-prev').innerHTML = icon('prev'); $('#s-next').innerHTML = icon('next');
  $('#mini-next').innerHTML = icon('next');
  $('#b-shuffle').innerHTML = icon('shuffle'); $('#b-queue').innerHTML = icon('queue');
  setPlayIcons(false); updateModes();
  audio.volume = 0.8; setBar(vol); setBar(seek);
  render('tab');
})();
</script>
</body>
</html>
